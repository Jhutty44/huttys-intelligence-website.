name: Import Hutty's Intelligence Website

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download website source
        run: |
          curl --fail --location --retry 3 \
            --output /tmp/website.zip \
            "https://d2ol7oe51mr4n9.cloudfront.net/user_3JdL0zNRE5dRIEUJbzdIc6tyL1m/bd967ab8-e3e5-45c9-a163-ed28452e71bc.zip"
          unzip -q -o /tmp/website.zip -d .
          test -f app/package.json

      - name: Save website to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                   rm -f .github/workflows/ci.yml
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Import Hutty's Intelligence website"
            git push
          fi
